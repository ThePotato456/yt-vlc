<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" xml:space="preserve">
  <style>
    .terminal { fill: #0d1117; stroke: #30363d; stroke-width: 2; }
    .titlebar { fill: #161b22; }
    .text { font: 20px "Cascadia Mono", "Consolas", monospace; fill: #c9d1d9; }
    .small { font: 16px "Segoe UI", sans-serif; fill: #8b949e; }
    .cyan { fill: #39c5cf; }
    .green { fill: #3fb950; }
    .blue { fill: #58a6ff; }
    .yellow { fill: #d29922; }
    .muted { fill: #8b949e; }
  </style>
  <rect x="1" y="1" width="1198" height="648" rx="14" class="terminal"/>
  <path d="M15 1h1170a14 14 0 0 1 14 14v34H1V15A14 14 0 0 1 15 1z" class="titlebar"/>
  <circle cx="27" cy="25" r="7" fill="#ff5f56"/>
  <circle cx="50" cy="25" r="7" fill="#ffbd2e"/>
  <circle cx="73" cy="25" r="7" fill="#27c93f"/>
  <text x="600" y="31" text-anchor="middle" class="small">PowerShell — first run</text>

  <g class="text cyan">
    <text x="48" y="88"> __   _______       __     ___     ____</text>
    <text x="48" y="116"> \ \ / /_   _|      \ \   / / |   / ___|</text>
    <text x="48" y="144">  \ V /  | |  _____  \ \ / /| |  | |</text>
    <text x="48" y="172">   | |   | | |_____|  \ V / | |__| |___</text>
    <text x="48" y="200">   |_|   |_|           \_/  |_____\____|</text>
  </g>
  <text x="48" y="232" class="text muted">       direct network playback via yt-dlp + VLC</text>

  <text x="48" y="288" class="text"><tspan class="blue">[GET]</tspan><tspan> Downloading yt-dlp.exe</tspan></text>
  <text x="48" y="326" class="text">
    <tspan>  yt-dlp.exe   [</tspan><tspan class="cyan">################################</tspan><tspan>] 100.0%   17.4 MiB / 17.4 MiB</tspan>
  </text>
  <text x="48" y="364" class="text"><tspan class="green">[OK]</tspan><tspan> Downloaded yt-dlp.exe (17.4 MiB)</tspan></text>

  <text x="48" y="420" class="text"><tspan class="blue">[GET]</tspan><tspan> Downloading vlc.zip</tspan></text>
  <text x="48" y="458" class="text">
    <tspan>  vlc.zip      [</tspan><tspan class="cyan">################################</tspan><tspan>] 100.0%   76.2 MiB / 76.2 MiB</tspan>
  </text>
  <text x="48" y="496" class="text"><tspan class="green">[OK]</tspan><tspan> Downloaded vlc.zip (76.2 MiB)</tspan></text>
  <text x="48" y="534" class="text"><tspan class="yellow">[...]</tspan><tspan> Extracting portable VLC</tspan></text>
  <text x="48" y="572" class="text"><tspan class="green">[OK]</tspan><tspan> Portable VLC extracted</tspan></text>

  <text x="48" y="620" class="text muted">Prerequisites are cached under ./bin for future launches.</text>
</svg>
